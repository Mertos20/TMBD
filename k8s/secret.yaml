# ─── Movibase Kubernetes Secret ────────────────────────────────────────────
# Bu dosyayı ASLA git'e commit etme!
# Değerleri base64'e çevirmek için:
#   PowerShell: [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("değer"))
#   Linux/Mac:  echo -n "değer" | base64
#
# Örnek:
#   MONGO_URI değerin: mongodb+srv://user:pass@cluster/db
#   Base64 karşılığı:  bW9uZ29kYit...

apiVersion: v1
kind: Secret
metadata:
  name: movibase-secrets
  namespace: movibase
type: Opaque
data:
  # !! Aşağıdaki değerleri kendi base64 encoded değerlerinle değiştir !!
  MONGO_URI: BASE64_ENCODED_MONGO_URI
  JWT_SECRET: BASE64_ENCODED_JWT_SECRET
  AZURE_FOUNDRY_ENDPOINT: BASE64_ENCODED_AZURE_FOUNDRY_ENDPOINT
  AZURE_FOUNDRY_KEY: BASE64_ENCODED_AZURE_FOUNDRY_KEY
  AZURE_FOUNDRY_MODEL: BASE64_ENCODED_AZURE_FOUNDRY_MODEL
  SPOTIFY_CLIENT_ID: BASE64_ENCODED_SPOTIFY_CLIENT_ID
  SPOTIFY_CLIENT_SECRET: BASE64_ENCODED_SPOTIFY_CLIENT_SECRET
  SPOTIFY_REDIRECT_URI: BASE64_ENCODED_SPOTIFY_REDIRECT_URI
  EMAIL_HOST: BASE64_ENCODED_EMAIL_HOST
  EMAIL_PORT: BASE64_ENCODED_EMAIL_PORT
  EMAIL_USER: BASE64_ENCODED_EMAIL_USER
  EMAIL_PASS: BASE64_ENCODED_EMAIL_PASS
  EMAIL_FROM: BASE64_ENCODED_EMAIL_FROM
  AZURE_STORAGE_CONNECTION_STRING: BASE64_ENCODED_AZURE_STORAGE_CONNECTION_STRING
  AZURE_STORAGE_CONTAINER_NAME: BASE64_ENCODED_AZURE_STORAGE_CONTAINER_NAME
